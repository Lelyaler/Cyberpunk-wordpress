version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: cyberpunk_wp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.6-php8.2-apache
    container_name: cyberpunk_wp_app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppassword
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_core:/var/www/html
      - .:/var/www/html/wp-content/themes/cyberpunk
      - ../sneakmax-woocommerce:/var/www/html/wp-content/themes/sneakmax
      - ../wp-cookie-notice:/var/www/html/wp-content/plugins/wp-cookie-notice
      - ../Cyberpunk-custom-meta-tags:/var/www/html/wp-content/plugins/custom-meta-tags
      - ../plugins/advanced-custom-fields-pro:/var/www/html/wp-content/plugins/advanced-custom-fields-pro
      - ../wp-multigeo-engine:/var/www/html/wp-content/plugins/wp-multigeo-engine
      - ../woo-fast-checkout-drawer:/var/www/html/wp-content/plugins/woo-fast-checkout-drawer

volumes:
  db_data:
  wp_core:
