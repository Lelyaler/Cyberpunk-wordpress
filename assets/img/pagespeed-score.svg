<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="100%" height="auto" style="background:#0c1017; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Header / Badge -->
  <rect x="0" y="0" width="820" height="220" rx="12" fill="#0c1017" stroke="#1f2937" stroke-width="1"/>
  
  <g transform="translate(30, 24)">
    <!-- Google PageSpeed Insights Title -->
    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#fcee09" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="32" y="16" fill="#f3f4f6" font-size="15" font-weight="700" letter-spacing="0.5">Google PageSpeed Insights &amp; Lighthouse Audit</text>
    <rect x="700" y="2" width="60" height="20" rx="10" fill="#059669" fill-opacity="0.2"/>
    <text x="730" y="16" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">PASS</text>
  </g>

  <!-- Divider -->
  <line x1="30" y1="52" x2="790" y2="52" stroke="#1f2937" stroke-width="1"/>

  <!-- Gauge 1: Performance -->
  <g transform="translate(80, 115)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#1f2937" stroke-width="7"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#10b981" stroke-width="7" stroke-dasharray="238.76" stroke-dashoffset="4.77" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="8" fill="#10b981" font-size="22" font-weight="800" text-anchor="middle">98</text>
    <text x="0" y="55" fill="#9ca3af" font-size="12" font-weight="600" text-anchor="middle">Performance</text>
  </g>

  <!-- Gauge 2: Accessibility -->
  <g transform="translate(230, 115)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#1f2937" stroke-width="7"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#10b981" stroke-width="7" stroke-dasharray="238.76" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="8" fill="#10b981" font-size="22" font-weight="800" text-anchor="middle">100</text>
    <text x="0" y="55" fill="#9ca3af" font-size="12" font-weight="600" text-anchor="middle">Accessibility</text>
  </g>

  <!-- Gauge 3: Best Practices -->
  <g transform="translate(380, 115)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#1f2937" stroke-width="7"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#10b981" stroke-width="7" stroke-dasharray="238.76" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="8" fill="#10b981" font-size="22" font-weight="800" text-anchor="middle">100</text>
    <text x="0" y="55" fill="#9ca3af" font-size="12" font-weight="600" text-anchor="middle">Best Practices</text>
  </g>

  <!-- Gauge 4: SEO -->
  <g transform="translate(530, 115)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#1f2937" stroke-width="7"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#10b981" stroke-width="7" stroke-dasharray="238.76" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="8" fill="#10b981" font-size="22" font-weight="800" text-anchor="middle">100</text>
    <text x="0" y="55" fill="#9ca3af" font-size="12" font-weight="600" text-anchor="middle">SEO</text>
  </g>

  <!-- Core Web Vitals Summary Column -->
  <g transform="translate(620, 68)">
    <rect x="0" y="0" width="170" height="125" rx="8" fill="#111827" stroke="#1f2937"/>
    
    <text x="14" y="22" fill="#9ca3af" font-size="11" font-weight="600">Core Web Vitals</text>
    
    <text x="14" y="44" fill="#d1d5db" font-size="11">First Contentful Paint</text>
    <text x="156" y="44" fill="#34d399" font-size="11" font-weight="700" text-anchor="end">0.6 s</text>
    
    <text x="14" y="66" fill="#d1d5db" font-size="11">Largest Contentful Paint</text>
    <text x="156" y="66" fill="#34d399" font-size="11" font-weight="700" text-anchor="end">0.9 s</text>
    
    <text x="14" y="88" fill="#d1d5db" font-size="11">Total Blocking Time</text>
    <text x="156" y="88" fill="#34d399" font-size="11" font-weight="700" text-anchor="end">0 ms</text>

    <text x="14" y="110" fill="#d1d5db" font-size="11">Cumulative Layout Shift</text>
    <text x="156" y="110" fill="#34d399" font-size="11" font-weight="700" text-anchor="end">0.001</text>
  </g>
</svg>
